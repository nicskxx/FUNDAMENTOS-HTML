<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPLOSÃO NUCLEAR 💥🦖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --preto: #000;
            --vermelho-escuro: #1a0000;
            --vermelho-medio: #440000;
            --laranja-vivo: #ff2200;
            --dourado: #ff0;
            --laranja: #f80;
            --laranja-escuro: #f40;
            --vermelho: #f00;
        }

        body {
            background: linear-gradient(180deg, var(--preto), var(--vermelho-escuro), var(--vermelho-medio), var(--laranja-vivo));
            background-size: 400% 400%;
            animation: fundo-explode 2s ease-in-out infinite alternate;
            font-family: 'Impact', 'Arial Black', sans-serif;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes fundo-explode {
            0%   { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        /* Chuva de símbolos */
        .chuva {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 7;
        }
        .chuva span {
            position: absolute;
            font-size: clamp(2rem, 5vw, 3.5rem);
            animation: cair-girar linear infinite;
            opacity: 0.8;
        }
        @keyframes cair-girar {
            0%   { transform: translateY(-60px) rotate(0deg); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translateY(100vh) rotate(1080deg); opacity: 0; }
        }

        /* Imagens de fundo flutuantes */
        .fundo-img {
            position: fixed;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            animation: flutuar-louco 5s ease-in-out infinite alternate;
        }
        .fundo-img:nth-child(odd) { animation-duration: 7s; }
        @keyframes flutuar-louco {
            0%   { transform: translate(0,0) rotate(-5deg) scale(1); }
            100% { transform: translate(30px,20px) rotate(5deg) scale(1.1); }
        }

        /* Título */
        h1 {
            text-align: center;
            color: #fff;
            margin: 20px 0 40px;
            font-size: clamp(2rem, 6vw, 4rem);
            text-transform: uppercase;
            letter-spacing: clamp(3px, 2vw, 8px);
            position: relative;
            z-index: 10;
            animation: treme-fogo 0.15s infinite alternate, brilha-nuclear 0.8s ease-in-out infinite alternate;
        }
        @keyframes treme-fogo {
            0%   { transform: translate(-3px,-2px) rotate(-0.8deg); }
            100% { transform: translate(3px,2px) rotate(0.8deg); }
        }
        @keyframes brilha-nuclear {
            0% {
                text-shadow: 0 0 10px #fff, 0 0 30px var(--dourado), 0 0 60px var(--laranja), 0 0 120px var(--laranja-escuro), 0 0 200px var(--vermelho);
            }
            100% {
                text-shadow: 0 0 20px #fff, 0 0 50px var(--dourado), 0 0 100px var(--laranja), 0 0 200px var(--laranja-escuro), 0 0 350px var(--vermelho), 0 0 500px var(--vermelho);
            }
        }

        /* Container das imagens */
        .dvi-images {
            margin-top: 30px;
            padding: clamp(15px, 4vw, 30px);
            border: 10px dashed var(--dourado);
            border-radius: 25px;
            background: rgba(93, 6, 6, 0.8);
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: borda-explosiva 0.6s ease-in-out infinite alternate, balanca-tudo 3s ease-in-out infinite;
            box-shadow: 0 0 40px var(--dourado), 0 0 80px var(--laranja), 0 0 150px var(--laranja-escuro), inset 0 0 80px rgba(255,80,0,0.5);
        }
        @keyframes borda-explosiva {
            0%   { border-color: var(--dourado); box-shadow: 0 0 40px var(--dourado), 0 0 80px var(--laranja), 0 0 150px var(--laranja-escuro); }
            100% { border-color: var(--vermelho); box-shadow: 0 0 60px var(--laranja), 0 0 120px var(--laranja-escuro), 0 0 250px var(--vermelho), 0 0 400px var(--vermelho); }
        }
        @keyframes balanca-tudo {
            0%,100% { transform: rotate(-0.7deg); }
            50%     { transform: rotate(0.7deg); }
        }

        /* Imagens */
        img {
            border-radius: 15px;
            border: 7px solid var(--laranja);
            box-shadow: 0 0 25px var(--laranja), 0 12px 35px rgba(0,0,0,0.9);
            transition: all 0.15s ease-out;
            object-fit: cover;
            animation: flutuar-sozinha 3s ease-in-out infinite alternate;
        }
        img:nth-child(2) { animation-delay: 0.15s; }
        img:nth-child(3) { animation-delay: 0.30s; }
        img:nth-child(4) { animation-delay: 0.45s; }
        @keyframes flutuar-sozinha {
            0%   { transform: translateY(-5px) rotate(-1.5deg); }
            100% { transform: translateY(8px) rotate(1.5deg); }
        }

        img:hover {
            transform: scale(1.25) rotate(8deg) translateY(-25px);
            border-color: #fff;
            box-shadow: 0 0 60px #fff, 0 0 120px var(--dourado), 0 0 200px var(--laranja), 0 0 350px var(--laranja-escuro), 0 30px 60px rgba(0,0,0,0.95);
            filter: brightness(1.8) contrast(1.5) saturate(2);
            animation: none;
            z-index: 100;
        }

        .img-destaque {
            height: clamp(250px, 50vw, 500px);
            width: 100%;
            max-width: 1200px;
        }
        .img-pqn {
            height: clamp(180px, 30vw, 250px);
            flex: 1 1 280px;
            max-width: 30%;
        }

        /* Rodapé */
        .rodape {
            text-align: center;
            margin-top: 50px;
            font-size: clamp(2rem, 8vw, 4.5rem);
            letter-spacing: clamp(5px, 3vw, 20px);
            position: relative;
            z-index: 10;
            animation: pula-fogo 0.5s ease-in-out infinite alternate;
        }
        @keyframes pula-fogo {
            0%   { transform: translateY(0); text-shadow: 0 0 30px var(--vermelho); }
            100% { transform: translateY(-15px); text-shadow: 0 0 60px var(--dourado), 0 0 120px var(--laranja), 0 0 200px var(--laranja-escuro); }
        }

        /* Responsivo */
        @media (max-width: 900px) {
            .img-pqn { max-width: 45%; }
        }
        @media (max-width: 600px) {
            .img-pqn { max-width: 100%; }
            .dvi-images { border-width: 6px; }
            body { padding: 10px; }
        }
    </style>
</head>
