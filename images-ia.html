<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPLOSÃO NUCLEAR 💥💀🦖✈️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #000000, #1a0000, #440000, #ff2200);
            background-size: 400% 400%;
            animation: fundo-explode 2s ease-in-out infinite alternate;
            font-family: 'Impact', 'Arial Black', sans-serif;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes fundo-explode {
            0%   { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        /* ====== CHUVA DE EXPLOSÕES, JATOS, DINOS E CAVEIRAS ====== */
        .chuva {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .chuva span {
            position: absolute;
            font-size: 50px;
            animation: cair-girar linear infinite;
            opacity: 0.8;
        }
        @keyframes cair-girar {
            0%   { transform: translateY(-60px) rotate(0deg); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translateY(100vh) rotate(1080deg); opacity: 0; }
        }

        /* ====== IMAGENS DE FUNDO FLUTUANDO ====== */
        .fundo-img {
            position: fixed;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            animation: flutuar-louco 5s ease-in-out infinite alternate;
        }
        .fundo-img:nth-child(odd) { animation-duration: 7s; }
        @keyframes flutuar-louco {
            0%   { transform: translate(0,0) rotate(-5deg) scale(1); }
            100% { transform: translate(30px,20px) rotate(5deg) scale(1.1); }
        }

        /* ====== TÍTULO QUE TREME, BRILHA E EXPLODE ====== */
        h1 {
            text-align: center;
            color: #fff;
            margin: 20px 0 40px;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            position: relative;
            z-index: 10;
            animation: treme-fogo 0.15s infinite alternate, brilha-nuclear 0.8s ease-in-out infinite alternate;
        }
        @keyframes treme-fogo {
            0%   { transform: translate(-3px,-2px) rotate(-0.8deg); }
            100% { transform: translate(3px,2px) rotate(0.8deg); }
        }
        @keyframes brilha-nuclear {
            0% {
                text-shadow:
                    0 0 10px #fff,
                    0 0 30px #ff0,
                    0 0 60px #f80,
                    0 0 120px #f40,
                    0 0 200px #f00;
            }
            100% {
                text-shadow:
                    0 0 20px #fff,
                    0 0 50px #ff0,
                    0 0 100px #f80,
                    0 0 200px #f40,
                    0 0 350px #f00,
                    0 0 500px #f00;
            }
        }

        /* ====== CONTAINER PRINCIPAL — PULSA E BALANÇA ====== */
        .dvi-images {
            margin-top: 30px;
            padding: 30px;
            border: 10px solid #ff0;
            border-radius: 25px;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: borda-explosiva 0.6s ease-in-out infinite alternate, balanca-tudo 3s ease-in-out infinite;
            box-shadow:
                0 0 40px #ff0,
                0 0 80px #f80,
                0 0 150px #f40,
                inset 0 0 80px rgba(255,80,0,0.5);
        }
        @keyframes borda-explosiva {
            0%   { border-color: #ff0; box-shadow: 0 0 40px #ff0, 0 0 80px #f80, 0 0 150px #f40; }
            100% { border-color: #f00; box-shadow: 0 0 60px #f80, 0 0 120px #f40, 0 0 250px #f00, 0 0 400px #f00; }
        }
        @keyframes balanca-tudo {
            0%,100% { transform: rotate(-0.7deg); }
            50%     { transform: rotate(0.7deg); }
        }

        /* ====== SUAS IMAGENS — EXPLODEM AO PASSAR O MOUSE ====== */
        img {
            border-radius: 15px;
            border: 7px solid #f80;
            box-shadow:
                0 0 25px #f80,
                0 12px 35px rgba(0,0,0,0.9);
            transition: all 0.15s ease-out;
            object-fit: cover;
            position: relative;
            animation: flutuar-sozinha 3s ease-in-out infinite alternate;
        }
        img:nth-child(2) { animation-delay: 0.15s; }
        img:nth-child(3) { animation-delay: 0.30s; }
        img:nth-child(4) { animation-delay: 0.45s; }
        img:nth-child(5) { animation-delay: 0.60s; }
        @keyframes flutuar-sozinha {
            0%   { transform: translateY(-5px) rotate(-1.5deg); }
            100% { transform: translateY(8px) rotate(1.5deg); }
        }

        img:hover {
            transform: scale(1.25) rotate(8deg) translateY(-25px);
            border-color: #fff;
            box-shadow:
                0 0 60px #fff,
                0 0 120px #ff0,
                0 0 200px #f80,
                0 0 350px #f40,
                0 30px 60px rgba(0,0,0,0.95);
            filter: brightness(1.8) contrast(1.5) saturate(2);
            animation: NENHUMA;
            z-index: 100;
        }

        .img-destaque {
            height: 500px;
            width: 100%;
            max-width: 1200px;
        }
        .img-pqn {
            height: 250px;
            flex: 1 1 280px;
            max-width: 30%;
        }

        /* ====== GALERIA DE IMAGENS IRADAS ====== */
        .galeria-irada {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            position: relative;
            z-index: 10;
        }
        .galeria-irada img {
            width: 280px;
            height: 200px;
            object-fit: cover;
            animation: flutuar-sozinha 4s ease-in-out infinite alternate;
        }

        .rodape {
            text-align: center;
            margin-top: 50px;
            font-size: 70px;
            letter-spacing: 20px;
            position: relative;
            z-index: 10;
            animation: pula-fogo 0.5s ease-in-out infinite alternate;
        }
        @keyframes pula-fogo {
            0%   { transform: translateY(0); text-shadow: 0 0 30px #f00; }
            100% { transform: translateY(-15px); text-shadow: 0 0 60px #ff0, 0 0 120px #f80, 0 0 200px #f40; }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .img-destaque { height: 300px; }
            .img-pqn { max-width: 100%; height: 200px; }
            h1 { font-size: 2rem; letter-spacing: 3px; }
            .dvi-images { padding: 15px; border-width: 6px; }
        }
    </style>
</head>
<body>

    <!-- IMAGENS DE FUNDO FLUTUANDO (EXPLOSÕES, JATOS, DINOS) -->
    <img class="fundo-img" src="https://images.unsplash.com/photo-1562065856-6b45b6e3d094?w=400" alt="" style="top:10%; left:5%; width:200px;">

    <h1>💀 EXPLOSÃO NUCLEAR 💀</h1>
